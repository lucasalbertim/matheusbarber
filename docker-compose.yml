version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: metheus_barber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metheus_network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metheus_barber
      SECRET_KEY: your-secret-key-here-change-in-production
      WHATSAPP_API_KEY: your-whatsapp-api-key
      WHATSAPP_PHONE_NUMBER: your-whatsapp-phone-number
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - ./frontend/build:/app/frontend_build
    networks:
      - metheus_network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - metheus_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  metheus_network:
    driver: bridge