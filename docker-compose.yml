
version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: metheus_barber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wpote420574
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metheus_network
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:wpote420574@postgres:5432/metheus_barber
      SECRET_KEY: chave-super-secreta-producao-matheusbarber-2024
      WHATSAPP_API_KEY: sua-chave-api-whatsapp-producao
      WHATSAPP_PHONE_NUMBER: seu-numero-whatsapp-producao
    depends_on:
      - postgres
    networks:
      - metheus_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_URL: https://matheusbarber.shop/api
    depends_on:
      - backend
    networks:
      - metheus_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  metheus_network:
    driver: bridge