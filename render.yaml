services:
  - type: web
    name: matheus-barber-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python scripts/seed_db.py
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        scope: build,runtime
        sync: false
      - key: SECRET_KEY
        scope: build,runtime
        sync: false
      - key: CORS_ORIGINS
        value: https://matheus-barber.vercel.app
        scope: runtime
      - key: ENVIRONMENT
        value: production
        scope: runtime
    healthCheckPath: /api/health
    buildDir: backend
